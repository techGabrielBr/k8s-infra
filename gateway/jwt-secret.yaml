# Secret gerenciado pelo External Secrets Operator: os valores vêm do
# AWS Secrets Manager em tempo de execução — nada sensível neste arquivo.
# Pré-requisito: ESO instalado + ClusterSecretStore (Infra/external-secrets/).
# O mesmo fcg/jwt alimenta UsersAPI (assina) e Kong (valida).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: fcg/jwt
        property: JWT_SECRET
